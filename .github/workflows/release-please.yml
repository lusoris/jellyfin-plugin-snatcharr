name: release-please

on:
  push:
    branches: [main]

# The job acts through the snatcharr-release GitHub App, not GITHUB_TOKEN: pull requests and
# releases created with GITHUB_TOKEN start no workflows, so release pull requests got no CI and
# releases never started release.yml (#9).
permissions: {}

jobs:
  release-please:
    uses: lusoris/SnatchArr/.github/workflows/release-please-app.yml@2bf15d49f0eca695707a999808bccd988e2160e1
    secrets:
      private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
