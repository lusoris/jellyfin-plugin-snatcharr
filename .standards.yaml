---
version: 1
repository:
  owner: lusoris
  name: jellyfin-plugin-snatcharr
  visibility: public
  description: "Jellyfin companion plugin for SnatchArr: adult scene metadata, image-set galleries and request routing"
  topics:
    - csharp
    - dotnet
    - jellyfin
    - jellyfin-plugin
    - snatcharr
adoption:
  # Praetor's generated bundle is Go-only; the plugin needs the .NET SDK (later slice).
  decline:
    - dev-container
# A Jellyfin server plugin: a library the server loads, no service of its own.
profiles:
  - library-client
agent_clients:
  - claude
  - codex
  - gemini
editors:
  - universal
  - vscode
  - antigravity
facets:
  - security:high
  - agent:sandboxed
# Same branch protection as lusoris/SnatchArr (ruleset 23770791): single-maintainer review mode,
# required contexts = the jobs this repository runs (ledger snatcharr-jfplugin-required-checks).
overrides:
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    review_mode: single_maintainer
    dismiss_stale_reviews: true
    require_extra_approval_for_unattributed_changes: true
register:
  sources:
    expected: 13
    sha256:
      sha256:ffc054cf234981c9a22b3f8a70bcf1249d9477fb29f751c062d8557c81427a3e
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: HISS-11
    path: .github/workflows/release.yml
    reason: adoption found the release workflows short of the declared supply chain (SLSA Build Level 3 declared, Level 0 measured; enforce_cosign without a cosign signing step; require_sbom without an SBOM step); raise them as docs/guides/releasing.md in Praetor describes, then remove this entry
    expires: "2027-01-23"
  - rule: HISS-18
    path: .github/workflows/ci.yml
    category: A
    entered: "2026-10-27"
    expires: "2027-01-25"
    reason: "category A, 90-day interval: the CI success aggregate (job status, if: always()) needs every job, and the trigger check does not read always(), so it reports status as skipped on a draft although it runs after a failed draft step (tools/ci/status.sh, planted cases in tools/ci/status_test.sh); the same check cannot see that the called lusoris/SnatchArr commit-policy.yml begins with the draft step; remove when cordanaLLM/praetor#1368 lands"
